<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | BY Sirius Group</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://bysirius.com/404.html" />
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="base.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #c9a84c, #e8c96a);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }
        .error-title {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            color: #fff;
            margin-bottom: 1rem;
        }
        .error-desc {
            color: #a0aabf;
            font-size: 1.05rem;
            max-width: 480px;
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn-home {
            background: linear-gradient(135deg, #c9a84c, #e8c96a);
            color: #000;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201,168,76,0.3);
        }
        .btn-contact {
            background: transparent;
            color: #c9a84c;
            padding: 12px 28px;
            border-radius: 8px;
            border: 1px solid #c9a84c;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-contact:hover {
            background: rgba(201,168,76,0.1);
        }
        .logo-404 {
            margin-bottom: 3rem;
        }
        .logo-404 img {
            height: 48px;
        }
        .nav-links-404 {
            display: flex;
            gap: 1.5rem;
            list-style: none;
            margin-top: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-links-404 a {
            color: #a0aabf;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .nav-links-404 a:hover {
            color: #c9a84c;
        }
    </style>
</head>

<body>
    <div class="error-page">
        <div class="logo-404">
            <a href="index.html">
                <img src="assets/images/logo.png" alt="BY Sirius Group" loading="lazy">
            </a>
        </div>

        <div class="error-code">404</div>
        <h1 class="error-title">Aradığınız sayfa bulunamadı</h1>
        <p class="error-desc">Bu sayfa taşınmış, silinmiş ya da hiç var olmamış olabilir. Ana sayfaya dönerek devam edebilirsiniz.</p>

        <div class="error-actions">
            <a href="index.html" class="btn-home">Ana Sayfaya Dön</a>
            <a href="iletisim.html" class="btn-contact">İletişime Geç</a>
        </div>

        <ul class="nav-links-404">
            <li><a href="hakkimizda.html">Hakkımızda</a></li>
            <li><a href="hizmetlerimiz.html">Hizmetlerimiz</a></li>
            <li><a href="sektorler.html">Sektörler</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="iletisim.html">İletişim</a></li>
        </ul>
    </div>
</body>

</html>
